<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/logo.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrapper" style="display: flex; align-items: center; justify-content: center; gap: 15px;">
      <a class="site-title" href="{{ '/' | relative_url }}" style="display: flex; align-items: center; gap: 20px; text-decoration: none;">
        <img src="{{ '/logo.svg' | relative_url }}" alt="Logo" style="height: 64px; width: auto; order: 1;">
        <span style="order: 2;">{{ site.title }}</span>
      </a>
    </div>
  </header>

  <main class="page-content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <p>&copy; 2019-2026 Tipz Team</p>
    </div>
  </footer>
</body>

</html>
